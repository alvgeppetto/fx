name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.sha }}

jobs:
  bench:
    name: Startup Latency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
          use-cache: false

      - name: Test benchmark contracts
        run: |
          python3 -m unittest \
            benchmarks.startup_contract_test \
            benchmarks.startup_runner_test \
            benchmarks.startup_workflow_test \
            -v

      - name: Build head (ReleaseSafe)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          zig build \
            -Doptimize=ReleaseSafe \
            --cache-dir "$RUNNER_TEMP/fx-startup-head-cache" \
            --global-cache-dir "$RUNNER_TEMP/fx-startup-global-cache"

      - name: Build base control (ReleaseSafe)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_worktree="$RUNNER_TEMP/fx-startup-base"
          cleanup() {
            git worktree remove --force "$base_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          git worktree add --detach "$base_worktree" "$BASE_SHA"
          test "$(git -C "$base_worktree" rev-parse HEAD)" = "$BASE_SHA"
          (
            cd "$base_worktree"
            zig build \
              -Doptimize=ReleaseSafe \
              --cache-dir "$RUNNER_TEMP/fx-startup-base-cache" \
              --global-cache-dir "$RUNNER_TEMP/fx-startup-global-cache"
          )
          cp "$base_worktree/zig-out/bin/fx" "$RUNNER_TEMP/fx-startup-control"
          chmod +x "$RUNNER_TEMP/fx-startup-control"

      - name: Install pinned Hyperfine
        id: hyperfine
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hyperfine-v1.20.0.tar.gz"
          install_dir="$RUNNER_TEMP/hyperfine-v1.20.0"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-x86_64-unknown-linux-musl.tar.gz
          echo "77611a0a0843d210996227e0fd596a9474ef57dd44268aef9c193c7c830cc125  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          test "$("$install_dir/hyperfine" --version)" = "hyperfine 1.20.0"
          echo "binary=$install_dir/hyperfine" >> "$GITHUB_OUTPUT"

      - name: Run registered startup measurements
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --ci
            --hyperfine "${{ steps.hyperfine.outputs.binary }}"
          )
          if [ -n "$BASE_SHA" ]; then
            arguments+=(
              --control-binary "$RUNNER_TEMP/fx-startup-control"
              --control-sha "$BASE_SHA"
            )
          fi
          ./benchmarks/startup.sh "${arguments[@]}"

      - name: Setup ProofPack fx plugin
        if: always()
        uses: ./.github/actions/setup-proofpack-fx

      - name: Test ProofPack fx plugin
        if: always()
        run: python -m unittest discover -s integrations/proofpack-fx/tests -v

      - name: Seal and verify startup evidence
        if: always() && hashFiles('benchmarks/results/startup-evidence/subject.json') != ''
        run: |
          set -euo pipefail
          proofpack fx seal benchmarks/results/startup-evidence
          proofpack fx verify benchmarks/results/startup-evidence
          python3 -m benchmarks.startup_verify benchmarks/results/startup-evidence

      - name: Run UI activity progress benchmark
        run: |
          set -euo pipefail
          mkdir -p benchmarks/results/ui-activity
          for run in 1 2 3; do
            zig build run-bench-ui-activity -Doptimize=ReleaseSafe \
              > "benchmarks/results/ui-activity/run-${run}.txt"
          done

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-evidence-${{ github.sha }}
          path: |
            benchmarks/results/startup-evidence
            benchmarks/results/ui-activity
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
